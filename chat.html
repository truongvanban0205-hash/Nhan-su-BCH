<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0068ff">
<title>Tin nhắn — BCH</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--xanh:#0068ff;--nen:#eef0f1;--chu:#081c36;--mo:#7589a3;--vien:#e1e4ea;--toi:#e5efff;--do:#e53935}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,'Be Vietnam Pro',sans-serif;color:var(--chu);background:#fff}
button{font-family:inherit;cursor:pointer}
/* chiều cao = vùng nhìn thấy thật (trừ bàn phím điện thoại) → ô nhập luôn nằm ngay trên bàn phím, tiêu đề không bị đẩy mất */
#app{display:flex;height:100vh;height:100dvh;height:var(--cao-thay,100dvh);position:fixed;left:0;right:0;top:0}
/* ---- danh sách ---- */
#list{width:360px;border-right:1px solid var(--vien);display:flex;flex-direction:column;background:#fff;min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--xanh);color:#fff;min-height:54px;padding-top:max(10px,env(safe-area-inset-top))}
.hd h1{font-size:17px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:11.5px;opacity:.85;font-weight:400}
/* icon nét mảnh (SVG) thay cho emoji */
.ic{display:inline-flex;width:22px;height:22px;flex:0 0 auto}
.ic svg,[data-ic] svg{width:100%;height:100%;display:block}
.ib{background:none;border:none;color:inherit;padding:7px;border-radius:50%;line-height:0;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px}
.ib svg{width:22px;height:22px}
.ib:hover{background:rgba(255,255,255,.15)}
.ib.xanh{color:var(--xanh)}
.ib.nho{width:28px;height:28px;flex-basis:28px;color:var(--mo)}
.ib.nho svg{width:16px;height:16px}
.tab-ds{display:flex;border-bottom:1px solid var(--vien);background:#fff}
.tab-ds button{flex:1;border:none;background:none;padding:10px 6px;font-size:14px;font-weight:600;color:var(--mo);border-bottom:2px solid transparent}
.tab-ds button.on{color:var(--xanh);border-bottom-color:var(--xanh)}
#soOnline{background:#2dc653;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:3px;display:none}
.tim{padding:8px 10px;border-bottom:1px solid var(--vien);position:relative}
.tim-ic{position:absolute;left:21px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mo)}
.tim input{width:100%;padding:8px 12px 8px 34px;border-radius:18px;border:none;background:#eaedf0;font-size:14px;outline:none}
.muc-ds{font-size:12px;font-weight:700;color:var(--mo);padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.3px}
.ng-goi{display:flex;gap:2px}
.ng-goi .ib{color:var(--xanh);width:34px;height:34px;flex-basis:34px}
.ng-goi .ib:hover{background:#eef4ff}
.ng-goi .ib svg{width:19px;height:19px}
#ds{flex:1;overflow-y:auto}
.ht{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.ht:hover,.ht.on{background:#eef4ff}
.av{width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;position:relative}
.av.nho{width:30px;height:30px;flex-basis:30px;font-size:11px}
.av.ti{width:16px;height:16px;flex-basis:16px;font-size:7px}
.av .onl{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:#2dc653;border:2px solid #fff}
.ht .gx{flex:1;min-width:0}
.ht .r1{display:flex;justify-content:space-between;gap:6px}
.ht .ten{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht .gio{font-size:11.5px;color:var(--mo);white-space:nowrap}
.ht .r2{display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.ht .cuoi{font-size:13px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht.moi .ten,.ht.moi .cuoi{font-weight:700;color:var(--chu)}
.badge{background:var(--do);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.trong{color:var(--mo);text-align:center;padding:40px 20px;font-size:14px;line-height:1.6}
/* ---- khung chat ---- */
#chat{flex:1;display:flex;flex-direction:column;background:var(--nen);min-width:0;position:relative}
#chat .hd{background:#fff;color:var(--chu);border-bottom:1px solid var(--vien)}
#chat .hd .ib:hover{background:#eef0f1}
#ghim{display:none;background:#fff;border-bottom:1px solid var(--vien);padding:7px 12px;font-size:13px;cursor:pointer;gap:8px;align-items:center}
#ghim b{color:var(--xanh)}
/* min-height:0 bắt buộc: không có thì khung tin dài ra theo nội dung, cả trang cuộn và thanh tên trôi mất */
#tn{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 4px}
#chat .hd,#ghim,#soan,#dangsoan{flex-shrink:0}
#ds{min-height:0}
.ngay{text-align:center;margin:12px 0 8px}
.ngay span{background:rgba(0,0,0,.25);color:#fff;font-size:11.5px;padding:3px 10px;border-radius:10px}
.ht-sys{text-align:center;font-size:12px;color:var(--mo);margin:8px 0}
.dong{display:flex;gap:6px;align-items:flex-end;margin:2px 0}
.dong.toi{flex-direction:row-reverse}
.dong .av{visibility:hidden}
.dong.dau .av{visibility:visible}
.bong{max-width:min(72%,520px);background:#fff;border-radius:12px;padding:7px 10px 5px;font-size:14.5px;line-height:1.4;position:relative;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.toi .bong{background:var(--toi)}
.bong .nguoi{font-size:12px;color:#c1690b;font-weight:600;margin-bottom:2px}
.bong .nd{white-space:pre-wrap}
.bong .nd a{color:var(--xanh)}
.bong .tg{font-size:10.5px;color:var(--mo);margin-top:3px}
.bong.thuhoi .nd{color:var(--mo);font-style:italic}
.bong .trich{border-left:3px solid var(--xanh);background:rgba(0,104,255,.06);padding:4px 8px;border-radius:4px;margin-bottom:5px;font-size:12.5px;cursor:pointer}
.bong .trich b{display:block;font-size:12px}
.nhac{color:var(--xanh);font-weight:600}
.cx{position:absolute;bottom:-11px;right:6px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:12px;padding:1px 5px;cursor:pointer;white-space:nowrap}
.dong.cocx{margin-bottom:14px}
.them{opacity:0;border:none;background:#fff;border-radius:50%;width:28px;height:28px;padding:5px;color:var(--mo);box-shadow:0 1px 3px rgba(0,0,0,.15);align-self:center}
.them svg{width:18px;height:18px}
#menu .mi{display:flex!important;align-items:center;gap:10px}
#menu .mi svg{width:18px;height:18px;color:var(--mo)}
.dong:hover .them{opacity:1}
.daxem{display:flex;justify-content:flex-end;gap:2px;font-size:11px;color:var(--mo);margin:2px 4px 6px}
.nhay{animation:nhay 1.2s}
@keyframes nhay{0%,60%{background:#fff3b0}}
#dangsoan{font-size:12px;color:var(--mo);padding:0 14px 3px;min-height:18px;font-style:italic}
#xuong{display:none;position:absolute;right:16px;bottom:84px;background:#fff;border:none;border-radius:18px;padding:7px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);color:var(--xanh);font-weight:600;font-size:13px}
/* ---- ô soạn ---- */
#soan{background:#fff;border-top:1px solid var(--vien);padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#traloi{display:none;align-items:center;gap:8px;font-size:12.5px;padding:4px 6px 8px;border-bottom:1px solid var(--vien);margin-bottom:6px}
#traloi .x{flex:1;border-left:3px solid var(--xanh);padding-left:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.o-soan{display:flex;align-items:flex-end;gap:6px}
#nhap{flex:1;resize:none;border:none;outline:none;font-size:15px;font-family:inherit;max-height:120px;padding:9px 6px;line-height:1.35}
#gui{background:none;border:none;color:var(--xanh);padding:6px;width:40px;height:40px}
#gui svg,#nutAnh svg{width:24px;height:24px}
#gui:disabled{color:#c0c8d2}
#goiy{display:none;max-height:180px;overflow-y:auto;border-bottom:1px solid var(--vien);margin-bottom:4px}
#goiy div{padding:7px 10px;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
#goiy div:hover,#goiy div.on{background:#eef4ff}
.av.lon{width:110px;height:110px;flex-basis:110px;font-size:36px;margin:0 auto}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.bong.co-anh{padding:3px}
.bong.co-anh .tg,.bong.co-anh .nguoi{padding:0 6px}
.bong img.anh{display:block;max-width:min(260px,62vw);max-height:340px;width:auto;height:auto;border-radius:9px;cursor:zoom-in;background:#dde3ea}
.anh-het{padding:18px 14px;color:var(--mo);font-size:13px;text-align:center}
#nutAnh,#nutChup{background:none;border:none;padding:6px;width:40px;height:40px;color:var(--xanh);flex:0 0 40px}
#nutChup svg{width:24px;height:24px}
#cam{display:none;position:fixed;inset:0;z-index:96;background:#000;flex-direction:column}
#cam video,#cam img{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#cam .cam-nut{display:flex;align-items:center;justify-content:space-around;padding:16px 10px max(18px,env(safe-area-inset-bottom));background:#000}
#cam .cn{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center}
#cam .cn svg{width:26px;height:26px}
#cam .chup{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}
#cam .chup:active{background:#fff}
#cam .chu{color:#fff;font-size:12px;text-align:center;margin-top:4px}
#cam .gui-anh{background:var(--xanh);color:#fff;border:none;border-radius:24px;padding:12px 26px;font-size:15px;font-weight:700}
#xemAnh{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#xemAnh img{max-width:96vw;max-height:84vh;object-fit:contain}
#xemAnh a{color:#fff;font-size:14px}
#tn.keo{outline:3px dashed var(--xanh);outline-offset:-6px}
#goi{display:none;position:fixed;inset:0;z-index:95;background:linear-gradient(160deg,#0b2a5b,#081c36);color:#fff;flex-direction:column;align-items:center;justify-content:space-between;padding:max(30px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom))}
#goiXa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#goiGan{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:110px;height:150px;object-fit:cover;border-radius:12px;display:none;border:2px solid rgba(255,255,255,.6);background:#222;z-index:2;transform:scaleX(-1)}
#goi.co-hinh #goiXa{display:block}
#goi.co-hinh #goiThe{background:rgba(0,0,0,.35);border-radius:14px;padding:6px 14px}
#goi.co-hinh #goiAv{display:none}
#goiThe{position:relative;z-index:1;text-align:center;margin-top:40px}
#goiAv .av{width:110px;height:110px;flex-basis:110px;font-size:36px;margin:0 auto 14px;box-shadow:0 0 0 10px rgba(255,255,255,.08)}
#goi.do-chuong #goiAv .av{animation:rung 1.4s infinite}
@keyframes rung{50%{box-shadow:0 0 0 22px rgba(255,255,255,.05)}}
#goiTen{font-size:22px;font-weight:700}
#goiTt{font-size:14px;opacity:.85;margin-top:6px}
#goiNut{position:relative;z-index:1;display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.gn{width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.gn .ic{width:28px;height:28px}
.gn.xoay .ic{transform:rotate(135deg)}
.gn.nhay-nut{animation:nhaynut 1s infinite}
@keyframes nhaynut{0%,100%{box-shadow:0 0 0 0 rgba(45,198,83,.7)}50%{box-shadow:0 0 0 16px rgba(45,198,83,0)}}
#goiNut>div{text-align:center;max-width:90px}
.gn.tat{background:#fff;color:#081c36}
.gn.do{background:#e53935}
.gn.xanh{background:#2dc653}
.gn-nhan{display:block;text-align:center;font-size:11.5px;margin-top:5px;opacity:.85}
#trong-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mo);text-align:center;padding:30px;font-size:15px;line-height:1.7}
/* ---- menu, hộp thoại ---- */
#menu{display:none;position:fixed;z-index:50;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);min-width:200px;overflow:hidden}
#menu .cxs{display:flex;justify-content:space-around;padding:8px 6px;border-bottom:1px solid var(--vien)}
#menu .cxs button{border:none;background:none;font-size:24px;padding:2px 4px;border-radius:8px}
#menu .cxs button:hover{background:#eef0f1;transform:scale(1.15)}
#menu .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 14px;font-size:14px}
#menu .mi:hover{background:#eef4ff}
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;align-items:center;justify-content:center;padding:12px}
#hop{background:#fff;border-radius:14px;width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#hop .hhd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--vien);font-weight:700;font-size:16px}
#hop .hhd span{flex:1}
#hop .hbd{overflow-y:auto;padding:10px 14px;flex:1}
#hop .hft{padding:10px 14px;border-top:1px solid var(--vien);display:flex;gap:8px;justify-content:flex-end}
.nut{border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;background:#eaedf0;color:var(--chu)}
.nut.c{background:var(--xanh);color:#fff}
.nut.d{background:#fdecec;color:var(--do)}
.nut:disabled{opacity:.5}
.oin{width:100%;padding:9px 12px;border:1px solid var(--vien);border-radius:8px;font-size:14px;font-family:inherit;outline:none;margin-bottom:8px}
.oin:focus{border-color:var(--xanh)}
.ng{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer;border-radius:8px}
.ng:hover{background:#f3f6fa}
.ng .gx{flex:1;min-width:0}
.ng .t1{font-size:14.5px;font-weight:600}
.ng .t2{font-size:12px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ng input[type=checkbox]{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#e5efff;color:var(--xanh);border-radius:14px;padding:3px 8px;font-size:12.5px;margin:0 4px 4px 0}
.dsmuc{font-size:12px;color:var(--mo);font-weight:600;margin:10px 0 4px;text-transform:uppercase}
#loi{display:none;position:fixed;inset:0;background:#fff;z-index:90;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;z-index:99;display:none;max-width:90vw}
/* ---- điện thoại: mỗi lúc 1 màn ---- */
@media (max-width:767px){
  #list{width:100%;border-right:none}
  #chat{display:none}
  body.dangchat #list{display:none}
  body.dangchat #chat{display:flex}
  #trong-chat{display:none}
  .bong{max-width:80%}
}
@media (min-width:768px){ .chi-dt{display:none} }
</style>
</head>
<body>
<div id="app">
  <!-- DANH SÁCH HỘI THOẠI -->
  <div id="list">
    <div class="hd">
      <button class="ib" id="nutVe" onclick="veTrangChu()" title="Về trang chủ" data-ic="ve"></button>
      <div id="avToi" onclick="moToi()" style="cursor:pointer" title="Ảnh đại diện của bạn"></div>
      <h1>Tin nhắn</h1>
      <button class="ib" onclick="moHuongDan()" title="Thông báo & cài app" id="nutTb" data-ic="chuong"></button>
      <button class="ib" onclick="moDanhBa()" title="Nhắn tin mới" data-ic="viet"></button>
      <button class="ib" onclick="moTaoNhom()" title="Tạo nhóm" data-ic="nhom"></button>
    </div>
    <div id="bangTb" style="display:none;background:#fff8e1;border-bottom:1px solid #f5d47a;padding:8px 12px;font-size:13px;align-items:center;gap:8px">
      <span style="flex:1">Bật thông báo để nhận tin nhắn và cuộc gọi cả khi đã đóng app.</span>
      <button class="nut c" style="padding:6px 12px;font-size:13px" onclick="moHuongDan()">Bật</button>
    </div>
    <div class="tab-ds"><button id="tabTin" class="on" onclick="doiTab('tin')">Tin nhắn</button><button id="tabOn" onclick="doiTab('online')">Danh bạ <span id="soOnline"></span></button></div>
    <div class="tim"><span class="tim-ic" data-ic="tim"></span><input id="timHt" placeholder="Tìm kiếm" oninput="veTab()"></div>
    <div id="ds"><div class="trong">Đang tải...</div></div>
  </div>
  <!-- KHUNG CHAT -->
  <div id="chat">
    <div id="trong-chat"><div><span data-ic="tin" style="display:block;width:64px;height:64px;margin:0 auto 10px;color:#b8c4d3"></span>Chọn một hội thoại để bắt đầu<br>hoặc mở <b>Danh bạ</b> để nhắn tin, gọi điện.</div></div>
    <div id="khung" style="display:none;flex:1;flex-direction:column;min-height:0">
      <div class="hd">
        <button class="ib chi-dt" onclick="dongChat()" data-ic="ve"></button>
        <div id="cAv"></div>
        <h1><span id="cTen"></span><div class="sub" id="cSub"></div></h1>
        <button class="ib xanh" id="nutGoi" onclick="batDauGoi('thoai')" title="Gọi thoại" style="display:none" data-ic="goi"></button>
        <button class="ib xanh" id="nutVideo" onclick="batDauGoi('video')" title="Gọi video" style="display:none" data-ic="video"></button>
        <button class="ib xanh" onclick="moTimTin()" title="Tìm tin nhắn" data-ic="tim"></button>
        <button class="ib xanh" onclick="moThongTin()" title="Thông tin" data-ic="tt"></button>
      </div>
      <div id="ghim" onclick="denTin(ghimId)"><span data-ic="ghim" style="color:var(--xanh);width:18px;height:18px;flex:0 0 18px"></span><div style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" id="ghimNd"></div><button class="ib nho" onclick="event.stopPropagation();ghimTin(null)" title="Bỏ ghim" data-ic="x"></button></div>
      <div id="tn" onscroll="khiCuon()"></div>
      <button id="xuong" onclick="cuonXuong(true)">↓ Tin mới</button>
      <div id="dangsoan"></div>
      <div id="soan">
        <div id="traloi"><span data-ic="traloi" style="color:var(--xanh);width:18px;height:18px;flex:0 0 18px"></span><div class="x" id="traloiNd"></div><button class="ib nho" onclick="boTraLoi()" data-ic="x"></button></div>
        <div id="goiy"></div>
        <div class="o-soan">
          <button id="nutAnh" onclick="document.getElementById('chonAnh').click()" title="Chọn ảnh từ thư viện" data-ic="anh"></button>
          <button id="nutChup" onclick="moCamera()" title="Chụp ảnh" data-ic="may_anh"></button>
          <input type="file" id="chupDuPhong" accept="image/*" capture="environment" style="display:none" onchange="guiAnh(this.files);this.value=''">
          <input type="file" id="chonAnh" accept="image/*" multiple style="display:none" onchange="guiAnh(this.files);this.value=''">
          <textarea id="nhap" rows="1" placeholder="Nhập tin nhắn..." enterkeyhint="send" oninput="khiGo()" onkeydown="phimNhap(event)"></textarea>
          <button id="gui" onclick="gui()" disabled title="Gửi" data-ic="gui"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="menu"></div>
<div id="mo" onclick="if(event.target===this)dongHop()"><div id="hop"></div></div>
<!-- CHỤP ẢNH TRỰC TIẾP -->
<div id="cam">

/* ---------- tiện ích ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function p2(n){ return n<10?'0'+n:''+n; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

function anhUrl(path){ return SUPABASE_URL+'/storage/v1/object/public/ht-anh/'+String(path).split('/').map(encodeURIComponent).join('/'); }

// Hỏi ảnh đại diện của những người chưa biết (1 lượt cho nhiều người), xong vẽ lại
const daHoiAnh = {};
let treVeAnh=null;
async function taiAnhDD(ids){
  const can=[...new Set(ids.filter(id=>id && !(id in daHoiAnh)))];
  if(!can.length) return;
  can.forEach(id=>daHoiAnh[id]=1);
  const r=await rpc('ht_anh_dai_dien',{p_ids:can});
  if(r.error) return; // chưa chạy SQL phần 3 → dùng chữ cái đầu
  let doi=false;
  can.forEach(id=>{ const v=(r.data||{})[String(id)]||''; if((ANH[id]||'')!==v){ ANH[id]=v; doi=true; } });
  if(doi){ clearTimeout(treVeAnh); treVeAnh=setTimeout(veLaiAnh, 50); }
}

function laOnline(t){ return t && (Date.now()-new Date(t).getTime()) < 3*60*1000; }
function truyCap(t){
  if(!t) return '';
  const p=Math.floor((Date.now()-new Date(t).getTime())/60000);
  if(p<3) return 'Vừa truy cập';
  if(p<60) return 'Truy cập '+p+' phút trước';
  if(p<1440) return 'Truy cập '+Math.floor(p/60)+' giờ trước';
  return 'Truy cập '+Math.floor(p/1440)+' ngày trước';
}
function gioNgan(t){
  if(!t) return '';
  const d=new Date(t), n=new Date();
  if(d.toDateString()===n.toDateString()) return p2(d.getHours())+':'+p2(d.getMinutes());
  const h=new Date(n); h.setDate(n.getDate()-1);
  if(d.toDateString()===h.toDateString()) return 'Hôm qua';
  if((n-d)<6*86400000) return ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()];
  return p2(d.getDate())+'/'+p2(d.getMonth()+1);
}
function nhanNgay(t){
  const d=new Date(t), n=new Date();
  if(d.toDateString()===n.toDateString()) return 'Hôm nay';
  const h=new Date(n); h.setDate(n.getDate()-1);
  if(d.toDateString()===h.toDateString()) return 'Hôm qua';
  return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();
}
function moTaTin(m){
  if(!m) return '';
  if(m.thu_hoi) return 'Tin nhắn đã thu hồi';
  if(m.loai==='anh') return '[Hình ảnh]';
  if(m.loai==='tep') return '[Tệp]';
  if(m.loai==='thoai') return '[Tin nhắn thoại]';
  return m.noi_dung||'';
}
async function rpc(ten, p){
  const r = await sc.rpc(ten, Object.assign({p_token:TOKEN}, p||{}));
  if(r.error && /CHUA_DANG_NHAP|CHUA_DUOC_DUYET/.test(r.error.message||'')) hienLoiDangNhap();
  return r;
}

  el.style.display='flex';
}

// Lưu thẻ phiên cho service worker (để nút "Từ chối" trên thông báo cuộc gọi chạy được khi app đang đóng)
function luuTheChoSW(t){
  try{
    const rq=indexedDB.open('bch-chat',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
    rq.onsuccess=()=>{ const tx=rq.result.transaction('kv','readwrite'); tx.objectStore('kv').put(t,'token'); };
  }catch(e){}
}

const NHUNG = window.parent!==window; // đang nằm trong khung chat nổi ở trang chủ
function baoCha(su){ if(NHUNG) try{ window.parent.postMessage({chat:su}, location.origin); }catch(e){} }

/* ---------- bàn phím điện thoại: giữ bố cục theo vùng nhìn thấy ---------- */
(function(){
  const vv=window.visualViewport; if(!vv) return;
  let truoc=vv.height;
  const chinh=()=>{
    const tn=document.getElementById('tn'), oCuoi=tn && (tn.scrollHeight-tn.scrollTop-tn.clientHeight<120);
    document.documentElement.style.setProperty('--cao-thay', vv.height+'px');
    document.getElementById('app').style.top=vv.offsetTop+'px';
    if(window.scrollY) window.scrollTo(0,0); // iPhone hay đẩy cả trang lên khi mở bàn phím
    if(tn && oCuoi && vv.height<truoc) tn.scrollTop=tn.scrollHeight; // bàn phím mở → vẫn thấy tin mới nhất
    truoc=vv.height;
  };
  vv.addEventListener('resize', chinh); vv.addEventListener('scroll', chinh); chinh();
})();

/* ---------- khởi động ---------- */
async function batDau(){
  let sv={}; try{ sv=JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{}; }catch(e){}
  TOKEN = sv.token || '';
  if(!TOKEN){ hienLoiDangNhap(); return; }
  const r = await rpc('ht_toi');
  if(r.error){ if(!/CHUA_DANG_NHAP|CHUA_DUOC_DUYET/.test(r.error.message||'')){ document.getElementById('ds').innerHTML='<div class="trong">Không tải được tin nhắn.<br><small>'+esc(r.error.message)+'</small></div>'; } return; }
  toi = r.data;
  luuTheChoSW(TOKEN);
  napHC(); // tin chưa gửi được từ lần trước (mất mạng / tắt app) → gửi tiếp
  setTimeout(chayHC, 1500);
  document.getElementById('avToi').innerHTML=avatar(toi.id,toi.ten,'nho');
  taiAnhDD([toi.id]);
  ketNoiRealtime();
  await taiDanhSach();
  taiDanhBa(); // đếm số người đang online cho tab Danh bạ
  setTimeout(donTep, 20000);
  const m = location.hash.match(/ht=(\d+)/);
  if(m) moHt(parseInt(m[1]));
  const g = location.hash.match(/goi=(\d+)/);
  if(g) moCuocGoiTuLink(parseInt(g[1]));
  khoiDongThongBao();
  window.addEventListener('hashchange', ()=>{ // bấm thông báo khi app đang mở
    const a=location.hash.match(/ht=(\d+)/), b=location.hash.match(/goi=(\d+)/);
    if(b) moCuocGoiTuLink(parseInt(b[1]));
    else if(a && (!htMo || htMo.id!==parseInt(a[1]))) moHt(parseInt(a[1]));
  });
  setInterval(()=>{ if(!document.hidden) rpc('ht_online'); }, 60000);
  setInterval(()=>{ if(!realtimeOk && !document.hidden){ taiDanhSach(); if(htMo) taiTinMoi(); } }, 5000); // dự phòng khi realtime mất
  setInterval(()=>{ if(htMo) veTieuDe(); }, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ rpc('ht_online'); dongBoLai(); if(!realtimeOk){ try{ sc.removeChannel(kenhToi); }catch(e){} ketNoiRealtime(); } } });
  window.addEventListener('pageshow', e=>{ if(e.persisted) dongBoLai(); }); // quay lại trang từ bộ nhớ đệm
}

/* ---------- realtime: kênh riêng của tôi (có tin mới / sửa / đã xem) ---------- */
let treDs=null, treTin=null, treTt=null;
function ketNoiRealtime(){
  try{
    kenhToi = sc.channel('u:'+toi.kenh, {config:{broadcast:{self:false}}})
      .on('broadcast', {event:'tin'}, ({payload})=>{
        clearTimeout(treDs); treDs=setTimeout(taiDanhSach, 400);
        if(htMo && payload && payload.ht===htMo.id){ clearTimeout(treTin); treTin=setTimeout(taiTinMoi, 150); delete nguoiSoan[payload.tu]; veDangSoan(); }
      })
      .on('broadcast', {event:'sua'}, ({payload})=>{
        clearTimeout(treDs); treDs=setTimeout(taiDanhSach, 400);
        if(htMo && payload && payload.ht===htMo.id){ clearTimeout(treTin); treTin=setTimeout(taiTinMoi, 150); }
      })
      .on('broadcast', {event:'xem'}, ({payload})=>{
        if(htMo && payload && payload.ht===htMo.id){ clearTimeout(treTt); treTt=setTimeout(taiThongTin, 300); }
      })
      .on('broadcast', {event:'ghim'}, ({payload})=>{
        if(htMo && payload && payload.ht===htMo.id) taiThongTin();
      })
      .on('broadcast', {event:'goi'}, ({payload})=>{ coCuocGoiDen(payload); })
      .on('broadcast', {event:'goi_tl'}, ({payload})=>{ khiTraLoiGoi(payload); })
      .on('broadcast', {event:'goi_kt'}, ({payload})=>{ if(GOI && payload && payload.id===GOI.id) ketThucGoi(false, 'Cuộc gọi đã kết thúc'); })
      .subscribe((st)=>{
        const truoc=realtimeOk;
        realtimeOk = (st==='SUBSCRIBED');
        if(realtimeOk && !truoc && daKetNoiLan1) dongBoLai(); // nối lại sau khi rớt → lấy bù tin bị lỡ
        if(realtimeOk) daKetNoiLan1=true;
        if(st==='CHANNEL_ERROR' || st==='TIMED_OUT' || st==='CLOSED'){ // rớt kết nối → tự nối lại (trong lúc chờ: tự làm mới 5 giây/lần)
          clearTimeout(henNoiLai); henNoiLai=setTimeout(()=>{ try{ sc.removeChannel(kenhToi); }catch(e){} ketNoiRealtime(); }, 4000);
        }
      });
  }catch(e){ realtimeOk=false; }
}
let daKetNoiLan1=false, henNoiLai=null;
// Lấy bù mọi thứ có thể bị lỡ (mở lại app, có mạng lại, nối lại realtime)
function dongBoLai(){
  if(!toi) return;
  taiDanhSach();
  if(htMo){ taiTinMoi(); taiThongTin(); }
  if(HANG_CHO.some(x=>x.tt!=='dang')){ HANG_CHO.forEach(x=>{ if(x.tt==='loi' && /Mất mạng/.test(x.loi||'')) x.tt='cho'; }); chayHC(); }
}
// kênh của hội thoại đang mở: chỉ dùng cho "đang soạn tin..."
function ketNoiKenhHt(){
  if(kenhHt){ try{ sc.removeChannel(kenhHt); }catch(e){} kenhHt=null; }
  nguoiSoan={}; veDangSoan();
  if(!htMo || !htMo.kenh) return;
  kenhHt = sc.channel('g:'+htMo.kenh, {config:{broadcast:{self:false}}})
    .on('broadcast', {event:'go'}, ({payload})=>{
      if(!payload || payload.e===toi.id) return;
      nguoiSoan[payload.e] = {ten:payload.ten, luc:Date.now()};
      veDangSoan();
      setTimeout(veDangSoan, 4500);
    })
    .subscribe();
}
function veDangSoan(){
  const now=Date.now(), ds=Object.keys(nguoiSoan).filter(k=>now-nguoiSoan[k].luc<4000).map(k=>nguoiSoan[k].ten);
  document.getElementById('dangsoan').textContent = ds.length ? (htMo&&htMo.loai==='nhom'? ds.join(', ')+' đang soạn tin...' : 'Đang soạn tin...') : '';
}
let lanBaoGo=0;
function baoDangGo(){
  if(!kenhHt || Date.now()-lanBaoGo<2500) return;
  lanBaoGo=Date.now();
  kenhHt.send({type:'broadcast', event:'go', payload:{e:toi.id, ten:toi.ten}});
}

/* ---------- danh sách hội thoại ---------- */
async function taiDanhSach(){
  const r = await rpc('ht_danh_sach');
  if(r.error) return;
  dsHt = r.data || [];
  if(htMo){ const m=dsHt.find(x=>x.id===htMo.id); if(m){ htMo=m; veTieuDe(); } }
  veDanhSach();
  taiAnhDD(dsHt.map(h=>h.doi_phuong));
}
/* ---------- 2 tab: Tin nhắn | Danh bạ (ai đang online, gọi nhanh) ---------- */
let TAB='tin';
function doiTab(t){
  TAB=t;
  document.getElementById('tabTin').classList.toggle('on', t==='tin');
  document.getElementById('tabOn').classList.toggle('on', t==='online');

function veTab(){ if(TAB==='tin') veDanhSach(); else veDanhBaTab(); }
function veDanhBaTab(){

    +'<div class="ng-goi"><button class="ib" title="Gọi thoại" onclick="event.stopPropagation();goiNhanh('+n.id+',\'thoai\')">'+ic('goi')+'</button>'
    +'<button class="ib" title="Gọi video" onclick="event.stopPropagation();goiNhanh('+n.id+',\'video\')">'+ic('video')+'</button></div></div>';

    +(con.length?'<div class="muc-ds">Mọi người</div>'+con.map(dong).join(''):'');

function demOnline(){
  const n=(dbCache||[]).filter(x=>laOnline(x.online_luc)).length, el=document.getElementById('soOnline');
  el.textContent=n; el.style.display=n?'inline':'none';
}
async function goiNhanh(id, loai){ await nhanRieng(id); if(htMo && htMo.doi_phuong===id) batDauGoi(loai); }
setInterval(()=>{ if(!document.hidden && toi){ dbCache=null; taiDanhBa().then(()=>{ demOnline(); veDanhBaTab(); }); } }, 60000);

function veDanhSach(){
  if(TAB!=='tin') return;
  const q=(document.getElementById('timHt').value||'').trim().toLowerCase();
  const ds=dsHt.filter(h=>!q || String(h.ten||'').toLowerCase().includes(q));
  const el=document.getElementById('ds');
  if(!ds.length){ el.innerHTML='<div class="trong">'+(q?'Không tìm thấy hội thoại.':'Chưa có tin nhắn nào.<br>Mở tab <b>Danh bạ</b> để nhắn tin hoặc gọi cho đồng nghiệp.')+'</div>'; return; }
  el.innerHTML=ds.map(h=>{
    const c=h.tin_cuoi;
    let cuoi=c?moTaTin(c):'';
    if(c && c.loai!=='he_thong'){ if(c.nguoi_gui===toi.id) cuoi='Bạn: '+cuoi; else if(h.loai==='nhom' && c.ten_gui) cuoi=c.ten_gui.split(' ').pop()+': '+cuoi; }
    const av=h.loai==='nhom'?avNhom():avatar(h.doi_phuong,h.ten,'',laOnline(h.online_luc));
    return '<div class="ht'+(h.chua_doc?' moi':'')+(htMo&&htMo.id===h.id?' on':'')+'" onclick="moHt('+h.id+')">'+av
      +'<div class="gx"><div class="r1"><div class="ten">'+esc(h.ten||'(Không tên)')+'</div><div class="gio">'+gioNgan(h.luc)+'</div></div>'
      +'<div class="r2"><div class="cuoi">'+esc(cuoi)+'</div>'+(h.tat_tb?'<span title="Đã tắt thông báo" style="color:var(--mo);display:inline-flex;width:15px;height:15px">'+ic('tat_chuong')+'</span>':'')
      +(h.chua_doc?'<span class="badge">'+(h.chua_doc>99?'99+':h.chua_doc)+'</span>':'')+'</div></div></div>';
  }).join('');
}

/* ---------- mở hội thoại ---------- */
async function moHt(id){
  let h=dsHt.find(x=>x.id===id);
  if(!h){ await taiDanhSach(); h=dsHt.find(x=>x.id===id); }
  if(!h){ h={id:id, loai:'nhom', ten:'', kenh:null}; }
  htMo=h; tinMo=[]; hetTinCu=false; ttMo=null; boTraLoi(); nhacIds={}; daBaoXem=0;
  history.replaceState(null,'','#ht='+id);
  document.body.classList.add('dangchat');
  document.getElementById('trong-chat').style.display='none';
  document.getElementById('khung').style.display='flex';
  document.getElementById('tn').innerHTML='<div class="trong">Đang tải...</div>';
  document.getElementById('nhap').value=''; capNhatNutGui();
  veTieuDe(); veDanhSach();
  await Promise.all([taiThongTin(), taiTinMoi(true)]);
  if(!htMo.kenh && ttMo) htMo.kenh=ttMo.kenh;
  ketNoiKenhHt();
  if(window.innerWidth>=768) document.getElementById('nhap').focus();
}
function dongChat(){
  htMo=null; ttMo=null;
  if(kenhHt){ try{ sc.removeChannel(kenhHt); }catch(e){} kenhHt=null; }
  history.replaceState(null,'',location.pathname);
  document.body.classList.remove('dangchat');
  document.getElementById('khung').style.display='none';
  document.getElementById('trong-chat').style.display='';
  veDanhSach();
}
function veTieuDe(){
  if(!htMo) return;
  const ten=(ttMo&&htMo.loai==='nhom'?ttMo.ten:null)||htMo.ten||'';
  document.getElementById('cTen').textContent=ten;
  document.getElementById('cAv').innerHTML=htMo.loai==='nhom'?avNhom().replace('class="av"','class="av nho"'):avatar(htMo.doi_phuong,ten,'nho',laOnline(htMo.online_luc));
  let sub='';
  if(htMo.loai==='nhom') sub=((ttMo&&ttMo.thanh_vien)||[]).length+' thành viên';
  else sub=laOnline(htMo.online_luc)?'Đang hoạt động':truyCap(htMo.online_luc)||(htMo.doi_phuong_chuc_vu||'');
  document.getElementById('cSub').textContent=sub;
  const rieng=htMo.loai==='rieng';
  document.getElementById('nutGoi').style.display=rieng?'':'none';
  document.getElementById('nutVideo').style.display=rieng?'':'none';
}
async function taiThongTin(){
  if(!htMo) return;
  const id=htMo.id, r=await rpc('ht_thong_tin',{p_ht:id});
  if(r.error || !htMo || htMo.id!==id) return;
  ttMo=r.data;
  if(htMo.loai!==ttMo.loai){ htMo.loai=ttMo.loai; }
  taiAnhDD((ttMo.thanh_vien||[]).map(t=>t.id));
  ghimId = ttMo.ghim ? ttMo.ghim.id : null;
  const g=document.getElementById('ghim');
  if(ttMo.ghim){ g.style.display='flex'; document.getElementById('ghimNd').innerHTML='<b>'+esc(ttMo.ghim.ten_gui||'')+':</b> '+esc(moTaTin(ttMo.ghim)); }
  else g.style.display='none';
  veTieuDe(); veDaXem();
}

/* ---------- tin nhắn ---------- */
async function taiTinMoi(dau){
  if(!htMo) return;
  const id=htMo.id, r=await rpc('ht_lay_tin',{p_ht:id, p_so:40});
  if(r.error){ if(dau) document.getElementById('tn').innerHTML='<div class="trong">Không tải được: '+esc(r.error.message)+'</div>'; return; }
  if(!htMo || htMo.id!==id) return;
  const tn=document.getElementById('tn');
  const sapCuoi = dau || (tn.scrollHeight-tn.scrollTop-tn.clientHeight<120);
  const moi = r.data||[];
  taiAnhDD(moi.map(m=>m.nguoi_gui));
  const map={}; tinMo.forEach(m=>map[m.id]=m); moi.forEach(m=>map[m.id]=m);
  const cuTruoc = tinMo.length ? tinMo[tinMo.length-1].id : 0;
  tinMo = Object.values(map).sort((a,b)=>a.id-b.id);
  if(dau && moi.length<40) hetTinCu=true;
  veTin();
  const coMoiCuaNguoiKhac = moi.some(m=>m.id>cuTruoc && m.nguoi_gui!==toi.id);
  if(sapCuoi) cuonXuong(false); else if(coMoiCuaNguoiKhac) document.getElementById('xuong').style.display='block';
  danhDauDaXem();
}
async function taiTinCu(){
  if(!htMo || hetTinCu || dangTaiCu || !tinMo.length) return;
  dangTaiCu=true;
  const id=htMo.id, tn=document.getElementById('tn'), caoTruoc=tn.scrollHeight;
  const r=await rpc('ht_lay_tin',{p_ht:id, p_truoc_id:tinMo[0].id, p_so:40});
  dangTaiCu=false;
  if(r.error || !htMo || htMo.id!==id) return;
  const cu=r.data||[];
  if(cu.length<40) hetTinCu=true;
  const map={}; cu.forEach(m=>map[m.id]=m); tinMo.forEach(m=>map[m.id]=m);
  tinMo=Object.values(map).sort((a,b)=>a.id-b.id);
  veTin();
  tn.scrollTop = tn.scrollHeight-caoTruoc;
}
function khiCuon(){
  const tn=document.getElementById('tn');
  if(tn.scrollTop<60) taiTinCu();
  if(tn.scrollHeight-tn.scrollTop-tn.clientHeight<80){ document.getElementById('xuong').style.display='none'; danhDauDaXem(); }
}
function cuonXuong(muot){
  const tn=document.getElementById('tn');
  tn.scrollTo({top:tn.scrollHeight, behavior:muot?'smooth':'auto'});
  document.getElementById('xuong').style.display='none';
}
let daBaoXem=0;
function danhDauDaXem(){
  if(!htMo || document.hidden || !tinMo.length) return;
  const tn=document.getElementById('tn');
  if(tn.scrollHeight-tn.scrollTop-tn.clientHeight>120) return;
  const cuoi=tinMo[tinMo.length-1].id;
  if(cuoi<=daBaoXem && htMo.chua_doc===0) return;
  daBaoXem=cuoi;
  rpc('ht_da_xem',{p_ht:htMo.id, p_tin:cuoi}).then(()=>{ if(htMo){ htMo.chua_doc=0; veDanhSach(); } baoCha('chua_doc'); });
}
// nội dung chữ: escape → link → @nhắc tên
function veNoiDung(s, m){
  let h=esc(s);
  h=h.replace(/(https?:\/\/[^\s<]+)/g, u=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>');
  if(m && m.nhac && m.nhac.length && ttMo){
    (ttMo.thanh_vien||[]).filter(t=>m.nhac.indexOf(t.id)>=0).forEach(t=>{
      const k='@'+esc(t.ten); h=h.split(k).join('<span class="nhac">'+k+'</span>');
    });
  }
  return h;
}
function veTin(){
  const tn=document.getElementById('tn');
  const cho=htMo?HANG_CHO.filter(x=>x.ht===htMo.id):[];
  if(!tinMo.length && !cho.length){ tn.innerHTML='<div class="trong">Chưa có tin nhắn.<br>Hãy gửi lời chào 👋</div>'; return; }
  let h=hetTinCu?'':'<div class="ngay"><span>Kéo lên để xem tin cũ</span></div>', ngayTruoc='', truoc=null;
  tinMo.forEach((m,i)=>{
    const ng=nhanNgay(m.tao_luc);
    if(ng!==ngayTruoc){ h+='<div class="ngay"><span>'+ng+'</span></div>'; ngayTruoc=ng; truoc=null; }
    if(m.loai==='he_thong'){ h+='<div class="ht-sys">'+esc(m.noi_dung)+'</div>'; truoc=null; return; }
    const sau=tinMo[i+1];
    const dau = !truoc || truoc.nguoi_gui!==m.nguoi_gui || (new Date(m.tao_luc)-new Date(truoc.tao_luc))>5*60000;
    const cuoiNhom = !sau || sau.loai==='he_thong' || sau.nguoi_gui!==m.nguoi_gui || (new Date(sau.tao_luc)-new Date(m.tao_luc))>5*60000 || nhanNgay(sau.tao_luc)!==ng;
    const laToi = m.nguoi_gui===toi.id;
    let b='';
    if(!laToi && htMo.loai==='nhom' && dau) b+='<div class="nguoi">'+esc(m.ten_gui||'')+'</div>';
    if(m.tra_loi && !m.thu_hoi) b+='<div class="trich" onclick="event.stopPropagation();denTin('+m.tra_loi.id+')"><b>'+esc(m.tra_loi.ten_gui||'')+'</b>'+esc(moTaTin(m.tra_loi))+'</div>';
    if(m.thu_hoi) b+='<div class="nd">Tin nhắn đã được thu hồi</div>';
    else if(m.loai==='chu') b+='<div class="nd">'+veNoiDung(m.noi_dung,m)+'</div>';
    else if(m.loai==='anh' && m.tep && m.tep.path){
      const u=anhUrl(m.tep.path), kt=(m.tep.rong&&m.tep.cao)?' width="'+m.tep.rong+'" height="'+m.tep.cao+'"':'';
      b+='<img class="anh" src="'+esc(u)+'"'+kt+' loading="lazy" alt="Ảnh" onclick="event.stopPropagation();xemAnh(\''+esc(u)+'\')">';
      if(m.noi_dung) b+='<div class="nd" style="padding:4px 6px 0">'+veNoiDung(m.noi_dung,m)+'</div>';
    }
    else if(m.loai==='anh') b+='<div class="anh-het">Ảnh đã hết hạn<br><small>(tự xoá sau 30 ngày)</small></div>';
    else b+='<div class="nd">'+esc(moTaTin(m))+'</div>';
    if(cuoiNhom) b+='<div class="tg">'+p2(new Date(m.tao_luc).getHours())+':'+p2(new Date(m.tao_luc).getMinutes())+'</div>';
    let cx='';
    if(m.cam_xuc && m.cam_xuc.length && !m.thu_hoi){
      const dem={}; m.cam_xuc.forEach(c=>dem[c.cx]=(dem[c.cx]||0)+1);
      cx='<div class="cx" onclick="event.stopPropagation();xemCamXuc('+m.id+')">'+Object.keys(dem).join('')+(m.cam_xuc.length>1?' '+m.cam_xuc.length:'')+'</div>';
    }
    h+='<div class="dong'+(laToi?' toi':'')+(dau?' dau':'')+(cx?' cocx':'')+'" id="m'+m.id+'" data-id="'+m.id+'">'
      +(laToi?'':avatar(m.nguoi_gui,m.ten_gui,'nho'))
      +'<div class="bong'+(m.thu_hoi?' thuhoi':'')+(m.loai==='anh'&&!m.thu_hoi?' co-anh':'')+'">'+b+cx+'</div>'
      +(m.thu_hoi?'':'<button class="them" onclick="event.stopPropagation();moMenu('+m.id+',this)" title="Thả cảm xúc, trả lời...">'+ic('cuoi')+'</button>')
      +'</div>';
    truoc=m;
  });
  h+='<div id="daxem"></div>';
  // tin đang chờ gửi / gửi lỗi (chỉ máy mình thấy)
  cho.forEach(m=>{
    const nd = m.loai==='anh' ? '<img class="anh" src="'+esc(m.xem||'')+'" alt="Ảnh" style="opacity:.6">' : '<div class="nd">'+esc(m.noi_dung)+'</div>';
    const tt = m.tt==='loi'
      ? '<div class="tg" style="color:var(--do)">⚠ '+esc(m.loi||'Chưa gửi được')+' · <a href="#" onclick="guiLai(\''+m.ma+'\');return false">Gửi lại</a> · <a href="#" onclick="boTinCho(\''+m.ma+'\');return false">Xoá</a></div>'
      : '<div class="tg">'+(m.loai==='anh'?'Đang tải ảnh lên...':'Đang gửi...')+'</div>';
    h+='<div class="dong toi"><div class="bong'+(m.loai==='anh'?' co-anh':'')+'">'+nd+tt+'</div></div>';
  });
  tn.innerHTML=h;
  veDaXem();
}
// "Đã xem" dưới tin cuối cùng của tôi
function veDaXem(){
  const el=document.getElementById('daxem'); if(!el || !ttMo || !tinMo.length) return;
  const cuoi=tinMo[tinMo.length-1];
  if(cuoi.nguoi_gui!==toi.id || cuoi.thu_hoi || HANG_CHO.some(x=>htMo&&x.ht===htMo.id)){ el.innerHTML=''; return; }
  const da=(ttMo.thanh_vien||[]).filter(t=>t.id!==toi.id && Number(t.doc_den)>=cuoi.id);
  if(htMo.loai==='rieng') el.innerHTML='<div class="daxem">'+(da.length?'✓✓ Đã xem':'✓ Đã gửi')+'</div>';
  else el.innerHTML='<div class="daxem" title="'+esc(da.map(t=>t.ten).join(', '))+'">'+(da.length?da.slice(0,8).map(t=>avatar(t.id,t.ten,'ti')).join('')+(da.length>8?' +'+(da.length-8):''):'✓ Đã gửi')+'</div>';
}
function denTin(id){
  if(!id) return;
  const el=document.getElementById('m'+id);
  if(!el){ toast('Tin này ở xa hơn, kéo lên để xem thêm.'); return; }
  el.scrollIntoView({behavior:'smooth', block:'center'});
  const b=el.querySelector('.bong'); b.classList.remove('nhay'); void b.offsetWidth; b.classList.add('nhay');
}

/* ---------- menu tin: cảm xúc, trả lời, sao chép, ghim, thu hồi ---------- */
function moMenu(id, neo){
  const m=tinMo.find(x=>x.id===id); if(!m || m.thu_hoi) return;
  const mine=m.nguoi_gui===toi.id, coThuHoi=mine && (Date.now()-new Date(m.tao_luc).getTime())<24*3600000;
  const toiCx=(m.cam_xuc||[]).find(c=>c.e===toi.id);
  const el=document.getElementById('menu');
  el.innerHTML='<div class="cxs">'+CAM_XUC.map(c=>'<button onclick="thaCamXuc('+id+',\''+c+'\')" style="'+(toiCx&&toiCx.cx===c?'background:#e5efff':'')+'">'+c+'</button>').join('')+'</div>'
    +'<button class="mi" onclick="chonTraLoi('+id+')">'+ic('traloi')+'Trả lời</button>'
    +(m.loai==='chu'?'<button class="mi" onclick="saoChep('+id+')">'+ic('chep')+'Sao chép</button>':'')
    +'<button class="mi" onclick="ghimTin('+id+')">'+ic('ghim')+'Ghim tin nhắn</button>'
    +(coThuHoi?'<button class="mi" style="color:var(--do)" onclick="thuHoi('+id+')">'+ic('thuhoi')+'Thu hồi</button>':'');
  el.style.display='block';
  const r=(neo||document.getElementById('m'+id)).getBoundingClientRect(), w=el.offsetWidth, hh=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(window.innerWidth-w-8, r.left+r.width/2-w/2))+'px';
  el.style.top=(r.top-hh-6>8 ? r.top-hh-6 : Math.min(window.innerHeight-hh-8, r.bottom+6))+'px';
}
function dongMenu(){ document.getElementById('menu').style.display='none'; }
document.addEventListener('click', e=>{ if(!e.target.closest('#menu')) dongMenu(); });
// nhấn giữ (điện thoại) / chuột phải (máy tính) trên bong bóng tin
(function(){
  const tn=document.getElementById('tn'); let t=null;
  tn.addEventListener('contextmenu', e=>{ const d=e.target.closest('.dong'); if(!d) return; e.preventDefault(); moMenu(parseInt(d.dataset.id)); });
  tn.addEventListener('touchstart', e=>{ const d=e.target.closest('.dong'); if(!d) return; t=setTimeout(()=>{ moMenu(parseInt(d.dataset.id)); t=null; }, 450); }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>tn.addEventListener(ev, ()=>{ if(t){ clearTimeout(t); t=null; } }, {passive:true}));
  tn.addEventListener('dblclick', e=>{ const d=e.target.closest('.dong'); if(!d || e.target.closest('a')) return; thaCamXuc(parseInt(d.dataset.id),'❤️'); });
})();
async function thaCamXuc(id, cx){
  dongMenu();
  const m=tinMo.find(x=>x.id===id); if(!m) return;
  // hiện ngay, server xác nhận sau
  const cu=(m.cam_xuc||[]).filter(c=>c.e!==toi.id), da=(m.cam_xuc||[]).find(c=>c.e===toi.id);
  m.cam_xuc = (da && da.cx===cx) ? cu : cu.concat([{e:toi.id, cx:cx, ten:toi.ten}]);
  veTin();
  const r=await rpc('ht_cam_xuc',{p_tin:id, p_cx:cx});
  if(r.error){ toast('Không thả được cảm xúc'); taiTinMoi(); }
}
function xemCamXuc(id){
  const m=tinMo.find(x=>x.id===id); if(!m) return;
  moHop('Cảm xúc', (m.cam_xuc||[]).map(c=>'<div class="ng">'+avatar(c.e,c.ten,'nho')+'<div class="gx"><div class="t1">'+esc(c.ten)+'</div></div><span style="font-size:20px">'+c.cx+'</span></div>').join(''), '');
}
function chonTraLoi(id){
  dongMenu();
  const m=tinMo.find(x=>x.id===id); if(!m) return;
  traLoi=m;
  document.getElementById('traloi').style.display='flex';
  document.getElementById('traloiNd').innerHTML='<b>Trả lời '+esc(m.ten_gui||'')+'</b>: '+esc(moTaTin(m));
  document.getElementById('nhap').focus();
}
function boTraLoi(){ traLoi=null; document.getElementById('traloi').style.display='none'; }
function saoChep(id){
  dongMenu();
  const m=tinMo.find(x=>x.id===id); if(!m) return;
  (navigator.clipboard?navigator.clipboard.writeText(m.noi_dung||''):Promise.reject()).then(()=>toast('Đã sao chép')).catch(()=>toast('Không sao chép được'));
}
async function ghimTin(id){
  dongMenu();
  const r=await rpc('ht_ghim',{p_ht:htMo.id, p_tin:id});
  if(r.error){ toast('Không ghim được'); return; }
  toast(id?'Đã ghim tin nhắn':'Đã bỏ ghim'); taiThongTin();
}
async function thuHoi(id){
  dongMenu();
  if(!confirm('Thu hồi tin nhắn này? Mọi người sẽ thấy "Tin nhắn đã được thu hồi".')) return;
  const r=await rpc('ht_thu_hoi',{p_tin:id});
  if(r.error){ toast('Chỉ thu hồi được tin của bạn trong 24 giờ'); return; }
  taiTinMoi();

function phimNhap(e){
  const g=document.getElementById('goiy');
  if(g.style.display==='block'){
    const items=[...g.children], i=items.findIndex(x=>x.classList.contains('on'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const j=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach(x=>x.classList.remove('on')); items[j].classList.add('on'); return; }
    if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); (items[i]||items[0]).click(); return; }
    if(e.key==='Escape'){ g.style.display='none'; return; }
  }
  // Enter = gửi, Shift+Enter = xuống dòng (máy tính lẫn điện thoại; bàn phím ảo hiện nút "Gửi").
  // Đang gõ dấu tiếng Việt (Telex/VNI đang ghép chữ) thì KHÔNG gửi, tránh mất chữ cuối.
  if(e.key==='Enter' && !e.shiftKey){
    if(e.isComposing || e.keyCode===229) return;
    e.preventDefault(); gui();
  }
}
// Điện thoại Android: bàn phím ảo báo mọi phím là 229 nên không bắt được ở keydown → bắt lúc nó định chèn xuống dòng
document.getElementById('nhap').addEventListener('beforeinput', e=>{
  if((e.inputType==='insertLineBreak' || e.inputType==='insertParagraph') && !e.isComposing && !phimShift){
    if(document.getElementById('goiy').style.display==='block') return;
    e.preventDefault(); gui();
  }
});

/* ---------- HÀNG CHỜ GỬI: hiện tin ngay (Đang gửi...), gửi lần lượt đúng thứ tự,
   lỗi / mất mạng → giữ lại (tin chữ lưu cả khi tắt app), có mạng lại tự gửi tiếp. Mỗi tin có mã tạm
   → gửi lại không bao giờ tạo tin trùng (server bỏ qua mã đã nhận). ---------- */
let HANG_CHO=[];   // {ma, ht, loai:'chu'|'anh', noi_dung, file, xem, tep, tra_loi, nhac, tt:'cho'|'dang'|'loi', loi}
let svCoMaTam=true, dangChayHC=false, lanGuiCuoi=0;
function maTam(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function khoaHC(){ return 'ht_cho_gui_'+(toi?toi.id:''); }
function luuHC(){ try{ localStorage.setItem(khoaHC(), JSON.stringify(HANG_CHO.filter(x=>x.loai==='chu').map(x=>({ma:x.ma,ht:x.ht,loai:'chu',noi_dung:x.noi_dung,tra_loi:x.tra_loi,nhac:x.nhac,luc:x.luc})))); }catch(e){} }
function napHC(){ try{ HANG_CHO=(JSON.parse(localStorage.getItem(khoaHC())||'[]')||[]).map(x=>Object.assign(x,{tt:'cho'})); }catch(e){ HANG_CHO=[]; } }
async function rpcGui(p){
  if(!svCoMaTam) delete p.p_ma_tam;
  let r=await rpc('ht_gui',p);
  if(r.error && svCoMaTam && /Could not find the function|p_ma_tam/i.test(r.error.message||'')){ svCoMaTam=false; delete p.p_ma_tam; r=await rpc('ht_gui',p); } // chưa chạy chat-7.sql
  return r;
}
async function guiMuc(m){
  m.tt='dang'; m.loi=''; if(htMo && htMo.id===m.ht) veTin();
  try{
    const p={p_ht:m.ht, p_noi_dung:m.noi_dung||null, p_tra_loi:m.tra_loi||null, p_nhac:m.nhac||[], p_ma_tam:m.ma};
    if(m.loai==='anh'){
      if(!m.tep) m.tep=await taiLenAnh('anh', m.file, 1600, false, m.ht); // tải ảnh 1 lần, gửi lại không tải lại
      p.p_loai='anh'; p.p_tep=m.tep;
    }
    const r=await rpcGui(p);
    if(r.error) throw new Error(r.error.message||'Lỗi không rõ');
    HANG_CHO=HANG_CHO.filter(x=>x!==m); luuHC();
    if(m.xem) setTimeout(()=>URL.revokeObjectURL(m.xem), 30000);
    return true;
  }catch(e){
    m.tt='loi';
    m.loi=(!navigator.onLine || /fetch|network|Failed/i.test(e.message)) ? 'Mất mạng — sẽ tự gửi khi có mạng' : e.message;
    luuHC(); if(htMo && htMo.id===m.ht) veTin();
    return false;
  }
}
async function chayHC(){
  if(dangChayHC) return; dangChayHC=true;
  let coGui=false;
  try{
    for(const m of HANG_CHO.slice()){
      if(m.tt!=='cho') continue;
      const ok=await guiMuc(m); coGui=coGui||ok;
      if(!ok && !navigator.onLine){ HANG_CHO.forEach(x=>{ if(x.tt==='cho') x.tt='loi', x.loi='Mất mạng — sẽ tự gửi khi có mạng'; }); break; }
    }
  }finally{ dangChayHC=false; }
  if(coGui){ if(htMo) await taiTinMoi(); taiDanhSach(); }
  else if(htMo) veTin();
  if(HANG_CHO.some(x=>x.tt==='cho')) chayHC();
}
function guiLai(ma){ const m=HANG_CHO.find(x=>x.ma===ma); if(m){ m.tt='cho'; chayHC(); } }
function boTinCho(ma){ HANG_CHO=HANG_CHO.filter(x=>x.ma!==ma); luuHC(); veTin(); }
window.addEventListener('online', ()=>{ toast('Đã có mạng lại'); HANG_CHO.forEach(x=>{ if(x.tt==='loi') x.tt='cho'; }); chayHC(); dongBoLai(); });

/* ---------- ảnh: nén, tải lên, gửi, xem lớn ---------- */
// Nén ảnh: cạnh dài tối đa `canh` px, JPEG ~82% (ảnh điện thoại 3–5 MB còn ~200–400 KB). `vuong`: cắt vuông (ảnh đại diện)
function nenAnh(file, canh, vuong){
  return new Promise((ok, loi)=>{
    if(file.type==='image/gif' && file.size<3*1024*1024 && !vuong){ // giữ ảnh động
      const im=new Image(); im.onload=()=>{ ok({blob:file, duoi:'gif', rong:im.naturalWidth, cao:im.naturalHeight}); URL.revokeObjectURL(im.src); };
      im.onerror=()=>loi(new Error('Không đọc được ảnh')); im.src=URL.createObjectURL(file); return;
    }
    const im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth, h=im.naturalHeight, sx=0, sy=0, sw=w, sh=h;
      if(vuong){ const c=Math.min(w,h); sx=(w-c)/2; sy=(h-c)/2; sw=sh=c; w=h=Math.min(c,canh); }
      else { const k=Math.min(1, canh/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(im.src);
      cv.toBlob(b=>b?ok({blob:b, duoi:'jpg', rong:w, cao:h}):loi(new Error('Không nén được ảnh')), 'image/jpeg', 0.82);
    };
    im.onerror=()=>loi(new Error('Không đọc được ảnh (định dạng không hỗ trợ)'));
    im.src=URL.createObjectURL(file);
  });
}
async function taiLenAnh(mucDich, file, canh, vuong, ht){
  const a=await nenAnh(file, canh, vuong);
  if(a.blob.size>5*1024*1024) throw new Error('Ảnh quá lớn (tối đa 5 MB)');
  const v=await rpc('ht_xin_ve',{p_muc_dich:mucDich, p_ht:mucDich==='anh'?(ht||htMo.id):null, p_duoi:a.duoi});
  if(v.error) throw new Error(v.error.message);
  const up=await sc.storage.from('ht-anh').upload(v.data, a.blob, {contentType:a.duoi==='gif'?'image/gif':'image/jpeg', cacheControl:'31536000', upsert:false});
  if(up.error) throw new Error(up.error.message);
  return {path:v.data, rong:a.rong, cao:a.cao};
}

  files=[...(files||[])].filter(f=>/^image\//.test(f.type));

  veTin(); cuonXuong(true); chayHC();
}
/* ---------- chụp ảnh trực tiếp: camera trước/sau → xem trước → chụp lại / gửi ---------- */
let CAM=null; // {luong, mat, blob}
async function moCamera(){
  if(!htMo) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ document.getElementById('chupDuPhong').click(); return; } // máy cũ: mở camera của hệ thống
  CAM={mat:'environment'};
  document.getElementById('cam').style.display='flex';

}
async function batCam(){
  if(!CAM) return;
  if(CAM.luong) CAM.luong.getTracks().forEach(t=>t.stop());
  const v=document.getElementById('camVideo'), xem=document.getElementById('camXem');
  xem.style.display='none'; v.style.display='block';
  try{
    CAM.luong=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.mat, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    v.srcObject=CAM.luong; v.style.transform = CAM.mat==='user' ? 'scaleX(-1)' : 'none';
    await v.play().catch(()=>{});
    document.getElementById('camNut').innerHTML=
      '<div><button class="cn" onclick="dongCamera()">'+ic('x')+'</button><div class="chu">Đóng</div></div>'
      +'<div><button class="cn chup" onclick="chupAnh()" title="Chụp"></button></div>'
      +'<div><button class="cn" onclick="CAM.mat=CAM.mat===\'user\'?\'environment\':\'user\';batCam()">'+ic('doi_cam')+'</button><div class="chu">Đổi camera</div></div>';
  }catch(e){
    const tuChoi = e.name==='NotAllowedError' || e.name==='SecurityError';
    dongCamera();
    if(confirm((tuChoi?'Bạn chưa cho phép dùng camera.\nMở cài đặt trang (biểu tượng ổ khoá cạnh địa chỉ web) → Camera → Cho phép.':'Không mở được camera: '+e.message)+'\n\nBấm OK để chọn ảnh có sẵn trong máy thay thế.'))
      document.getElementById('chonAnh').click();
  }
}
function chupAnh(){
  const v=document.getElementById('camVideo'); if(!v.videoWidth) return;
  const cv=document.createElement('canvas'); cv.width=v.videoWidth; cv.height=v.videoHeight;
  const cx=cv.getContext('2d');
  if(CAM.mat==='user'){ cx.translate(cv.width,0); cx.scale(-1,1); } // camera trước: lưu đúng chiều như đang thấy
  cx.drawImage(v,0,0);
  cv.toBlob(b=>{
    if(!b) return;
    CAM.blob=b;
    const xem=document.getElementById('camXem'); xem.src=URL.createObjectURL(b); xem.style.display='block'; v.style.display='none';
    document.getElementById('camNut').innerHTML=
      '<div><button class="cn" onclick="batCam()">'+ic('thuhoi')+'</button><div class="chu">Chụp lại</div></div>'
      +'<button class="gui-anh" id="camGui" onclick="guiAnhChup()">Gửi ảnh</button>';
  }, 'image/jpeg', 0.9);
}
function guiAnhChup(){
  if(!CAM || !CAM.blob) return;

}
function dongCamera(){
  if(CAM && CAM.luong) CAM.luong.getTracks().forEach(t=>t.stop());

/* ---------- THÔNG BÁO ĐẨY & CÀI APP ---------- */
let CAU_HINH=null;
async function layCauHinh(){
  if(CAU_HINH) return CAU_HINH;
  const r=await rpc('ht_cau_hinh'); CAU_HINH=r.error?{}:(r.data||{}); return CAU_HINH;
}
const laIOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const daCaiApp=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const hoTroPush=('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
function khoaB64(s){ const p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
async function khoiDongThongBao(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const canBat = !hoTroPush || Notification.permission!=='granted';
  document.getElementById('bangTb').style.display = canBat && localStorage.getItem('ht_an_bang_tb')!=='1' ? 'flex' : 'none';
  if(hoTroPush && Notification.permission==='granted') dangKyPush(true); // gắn lại thiết bị với tài khoản đang đăng nhập
}
async function dangKyPush(im){
  try{
    if(!hoTroPush) throw new Error(laIOS&&!daCaiApp?'Trên iPhone phải "Thêm vào Màn hình chính" rồi mở app từ biểu tượng đó.':'Trình duyệt này không hỗ trợ thông báo đẩy.');
    const cfg=await layCauHinh();
    if(!cfg.vapid_public) throw new Error('Quản trị chưa cấu hình thông báo đẩy.');
    const quyen = Notification.permission==='granted' ? 'granted' : (im ? Notification.permission : await Notification.requestPermission());
    if(quyen!=='granted') throw new Error(quyen==='denied'?'Bạn đã chặn thông báo. Mở cài đặt trang (biểu tượng ổ khoá cạnh địa chỉ) → Thông báo → Cho phép.':'Chưa cho phép thông báo.');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey){ // khoá đổi → đăng ký lại
      const cu=btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      if(cu!==cfg.vapid_public){ await sub.unsubscribe(); sub=null; }
    }
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:khoaB64(cfg.vapid_public)});
    const j=sub.toJSON();
    const r=await rpc('ht_dang_ky_push',{p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_thiet_bi:navigator.userAgent.slice(0,180)});
    if(r.error) throw new Error(r.error.message);
    document.getElementById('bangTb').style.display='none';
    if(!im) toast('🔔 Đã bật thông báo trên máy này');
    return true;
  }catch(e){ if(!im) alert(e.message); return false; }
}
function moHuongDan(){
  const bat = hoTroPush && Notification.permission==='granted';
  let h='<div class="dsmuc">Thông báo trên máy này</div>'
    +(bat?'<div style="color:#2f9e44;font-weight:600;margin-bottom:8px">✓ Đã bật. Bạn sẽ nhận tin nhắn và cuộc gọi kể cả khi đóng app.</div>'

/* ---------- GỌI THOẠI / VIDEO 1-1 (WebRTC) ---------- */
let GOI=null; // {id, ht, kenh, loai, laNguoiGoi, ten, doiPhuong, pc, ch, local, iceCho, batDau, dongHo, het, sanSang}
/* Chuông: trình duyệt chỉ cho phát tiếng sau khi người dùng chạm vào trang ít nhất 1 lần
   → "mở khoá" âm thanh ngay lần chạm đầu tiên, giữ dùng lại cho mọi cuộc gọi sau. */
let AC=null, chuong=null;
function moKhoaAmThanh(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, moKhoaAmThanh, {passive:true}));
function phatChuong(kieu){ // tự tạo tiếng chuông kiểu điện thoại, không cần file âm thanh
  dungChuong();
  moKhoaAmThanh();
  const keu=()=>{
    try{
      if(!AC) return; if(AC.state==='suspended') AC.resume();
      const t=AC.currentTime, nhip = kieu==='den' ? [0,0.18,0.36,0.54, 1.0,1.18,1.36,1.54] : [0];
      nhip.forEach(d=>{ const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
        o.frequency.value = kieu==='den' ? 1046 : 425; o2.frequency.value = kieu==='den' ? 1318 : 425;
        const dai = kieu==='den' ? 0.15 : 1.0, to = kieu==='den' ? 0.25 : 0.1;
        g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(to,t+d+0.02); g.gain.setValueAtTime(to,t+d+dai-0.03); g.gain.linearRampToValueAtTime(0,t+d+dai);
        o.connect(g); o2.connect(g); g.connect(AC.destination); o.start(t+d); o2.start(t+d); o.stop(t+d+dai); o2.stop(t+d+dai); });
    }catch(e){}
    if(kieu==='den' && navigator.vibrate){ try{ navigator.vibrate([700,400,700]); }catch(e){} }
  };
  keu();
  chuong={h:setInterval(keu, kieu==='den'?2500:3500)};
}
function dungChuong(){ if(chuong){ clearInterval(chuong.h); chuong=null; } try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){} }
// App đang chạy nền (tab khác / màn hình khoá nhưng trình duyệt còn chạy) → bật thông báo của máy để đổ chuông + rung
async function baoGoiNen(g){
  if(!document.hidden || !hoTroPush || Notification.permission!=='granted') return;
  try{
    const reg=await navigator.serviceWorker.ready;
    reg.showNotification('Cuộc gọi '+(g.loai==='video'?'video':'thoại')+' đến', {
      body:(g.ten_goi||'')+' đang gọi cho bạn...', tag:'goi-'+g.id, renotify:true, requireInteraction:true,
      icon:'./icon.png', badge:'./icon.png', vibrate:[700,400,700,400,700,400,700],
      actions:[{action:'nghe', title:'Nghe'},{action:'tu_choi', title:'Từ chối'}],
      data:{url:'./chat.html#ht='+g.ht+'&goi='+g.id, goi:g.id}});
  }catch(e){}
}
function dongThongBaoGoi(id){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg=>reg.getNotifications({tag:'goi-'+id})).then(ds=>ds.forEach(n=>n.close())).catch(()=>{});
}
function veGoi(tt, nut){
  const el=document.getElementById('goi');
  el.style.display='flex';
  document.getElementById('goiAv').innerHTML=avatar(GOI.doiPhuong, GOI.ten, '');
  document.getElementById('goiTen').textContent=GOI.ten||'';
  document.getElementById('goiTt').textContent=tt;
  document.getElementById('goiNut').innerHTML=nut;
}
function nutGoi(t, nhan, lop, fn){ return '<div><button class="gn '+(lop||'')+'" onclick="'+fn+'">'+ic(t)+'</button><span class="gn-nhan">'+nhan+'</span></div>'; }
function nutDangGoi(){
  const am=GOI.local && GOI.local.getAudioTracks()[0], hinh=GOI.local && GOI.local.getVideoTracks()[0];
  return nutGoi(am&&!am.enabled?'tat_mic':'mic', am&&!am.enabled?'Bật mic':'Tắt mic', am&&!am.enabled?'tat':'', 'batTatMic()')
    +(GOI.loai==='video'?nutGoi(hinh&&!hinh.enabled?'tat_video':'video', hinh&&!hinh.enabled?'Bật camera':'Tắt camera', hinh&&!hinh.enabled?'tat':'', 'batTatCam()')+nutGoi('doi_cam','Đổi camera','','doiCam()'):'')
    +nutGoi('goi','Kết thúc','do xoay','ketThucGoi(true)');
}
async function layMicCam(loai, mat){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Trình duyệt không hỗ trợ gọi (cần mở bằng https và trình duyệt mới).');
  try{
    return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true},
      video: loai==='video' ? {facingMode:mat||'user', width:{ideal:640}, height:{ideal:480}} : false});
  }catch(e){
    throw new Error(e.name==='NotAllowedError'?'Bạn chưa cho phép dùng micro'+(loai==='video'?'/camera':'')+'. Mở cài đặt trang để cho phép.':'Không mở được micro'+(loai==='video'?'/camera':'')+': '+e.message);
  }
}
function guiKenh(su, data){ if(GOI && GOI.ch) GOI.ch.send({type:'broadcast', event:su, payload:Object.assign({tu:toi.id}, data||{})}); }
async function taoKetNoi(){
  const cfg=await layCauHinh();
  const pc=new RTCPeerConnection({iceServers:cfg.ice||[{urls:'stun:stun.l.google.com:19302'}]});
  GOI.pc=pc; GOI.iceCho=[];
  GOI.local.getTracks().forEach(t=>pc.addTrack(t, GOI.local));
  pc.onicecandidate=e=>{ if(e.candidate) guiKenh('ice',{c:e.candidate.toJSON()}); };
  pc.ontrack=e=>{
    const v=document.getElementById('goiXa'); v.srcObject=e.streams[0]; v.play().catch(()=>{});
    if(GOI.loai==='video') document.getElementById('goi').classList.add('co-hinh');
  };
  pc.onconnectionstatechange=()=>{
    if(!GOI) return;
    if(pc.connectionState==='connected' && !GOI.batDau){
      GOI.batDau=Date.now(); dungChuong(); document.getElementById('goi').classList.remove('do-chuong');
      GOI.dongHo=setInterval(()=>{ const s=Math.floor((Date.now()-GOI.batDau)/1000); document.getElementById('goiTt').textContent=p2(Math.floor(s/60))+':'+p2(s%60); },1000);
      veGoi('00:00', nutDangGoi());
    }
    if(pc.connectionState==='failed') ketThucGoi(true, 'Không nối được cuộc gọi: mạng đang chặn kết nối trực tiếp. Cần bật máy chủ chuyển tiếp (TURN).');
    // mất sóng giữa chừng: chờ 10 giây xem có nối lại được không
    if(pc.connectionState==='disconnected' && GOI.batDau){
      document.getElementById('goiTt').textContent='Mất kết nối, đang thử lại...';
      clearTimeout(GOI.matSong); GOI.matSong=setTimeout(()=>{ if(GOI && GOI.pc && GOI.pc.connectionState!=='connected') ketThucGoi(true, 'Cuộc gọi bị ngắt do mạng yếu'); }, 10000);
    }
  };
  pc.oniceconnectionstatechange=()=>{ // hiện tiến trình để biết kẹt ở đâu
    if(GOI && !GOI.batDau){ const t={checking:'Đang kết nối...', failed:'Không nối được'}[pc.iceConnectionState]; if(t) document.getElementById('goiTt').textContent=t; }
  };
  return pc;
}
function moKenhGoi(){
  return new Promise(ok=>{
    GOI.ch=sc.channel('c:'+GOI.kenh, {config:{broadcast:{self:false}}})
      .on('broadcast',{event:'san_sang'}, async ()=>{ // người nghe đã sẵn sàng → người gọi gửi lời mời kết nối
        if(!GOI || !GOI.laNguoiGoi || GOI.daGuiOffer) return;
        GOI.daGuiOffer=true;
        const o=await GOI.pc.createOffer(); await GOI.pc.setLocalDescription(o);
        guiKenh('offer',{sdp:GOI.pc.localDescription.toJSON()});
      })
      .on('broadcast',{event:'offer'}, async ({payload})=>{
        if(!GOI || GOI.laNguoiGoi || GOI.daNhanOffer) return;
        GOI.daNhanOffer=true;
        await GOI.pc.setRemoteDescription(payload.sdp);
        for(const c of GOI.iceCho) await GOI.pc.addIceCandidate(c).catch(()=>{});
        GOI.iceCho=[];
        const a=await GOI.pc.createAnswer(); await GOI.pc.setLocalDescription(a);
        guiKenh('answer',{sdp:GOI.pc.localDescription.toJSON()});
      })
      .on('broadcast',{event:'answer'}, async ({payload})=>{
        if(!GOI || !GOI.laNguoiGoi || GOI.pc.currentRemoteDescription) return;
        await GOI.pc.setRemoteDescription(payload.sdp);
        for(const c of GOI.iceCho) await GOI.pc.addIceCandidate(c).catch(()=>{});
        GOI.iceCho=[];
      })
      .on('broadcast',{event:'ice'}, async ({payload})=>{
        if(!GOI || !GOI.pc) return;
        if(GOI.pc.remoteDescription) await GOI.pc.addIceCandidate(payload.c).catch(()=>{});
        else GOI.iceCho.push(payload.c);
      })
      .on('broadcast',{event:'ket_thuc'}, ()=>{ ketThucGoi(false, 'Cuộc gọi đã kết thúc'); })
      .subscribe(st=>{ if(st==='SUBSCRIBED') ok(); });
  });
}
// Người GỌI
async function batDauGoi(loai){
  if(GOI){ toast('Đang có cuộc gọi khác'); return; }
  if(!htMo || htMo.loai!=='rieng') return;

  if(r.error){ local.getTracks().forEach(t=>t.stop()); toast('❌ Không gọi được: '+r.error.message); return; }
  const g=r.data;
  GOI={id:g.id, ht:g.ht, kenh:g.kenh, loai:g.loai, laNguoiGoi:true, ten:g.ten_nghe, doiPhuong:g.nguoi_nghe, local:local};
  hienHinhMinh();
  veGoi('Đang gọi...', nutGoi('goi','Huỷ','do xoay','ketThucGoi(true)'));
  document.getElementById('goi').classList.add('do-chuong');
  phatChuong('di');
  await taoKetNoi(); await moKenhGoi();

function khiTraLoiGoi(g){
  if(!GOI || !g || g.id!==GOI.id) return;

// Đã bắt máy → bỏ hẹn giờ "không ai nghe", chờ tối đa 30 giây để 2 máy nối được với nhau
function choKetNoi(){
  if(!GOI) return;
  clearTimeout(GOI.het);
  GOI.het=setTimeout(()=>{ if(GOI && !GOI.batDau) ketThucGoi(true, 'Không nối được cuộc gọi: mạng 4G/Wi-Fi đang chặn kết nối trực tiếp. Cần bật máy chủ chuyển tiếp (TURN).'); }, 30000);
}
// Người NGHE
function coCuocGoiDen(g){

  if(GOI){ return; } // đang trong cuộc gọi khác → để người kia tự hết giờ
  GOI={id:g.id, ht:g.ht, kenh:g.kenh, loai:g.loai, laNguoiGoi:false, ten:g.ten_goi, doiPhuong:g.nguoi_goi};

async function moCuocGoiTuLink(id){ // bấm thông báo "cuộc gọi đến"
  if(GOI && GOI.id===id) return;
  const r=await rpc('ht_xem_goi',{p_goi:id});

  else toast(r.data.trang_thai==='nho'?'📞 Cuộc gọi nhỡ từ '+(r.data.ten_goi||''):'Cuộc gọi đã kết thúc');
}
async function ngheGoi(){
  if(!GOI) return;
  dungChuong();
  let local;
  try{ local=await layMicCam(GOI.loai); }catch(e){ alert(e.message); tuChoiGoi(); return; }
  GOI.local=local; hienHinhMinh();
  const r=await rpc('ht_tra_loi_goi',{p_goi:GOI.id, p_nghe:true});
  if(r.error){ ketThucGoi(false, 'Cuộc gọi đã kết thúc'); return; }
  choKetNoi();
  veGoi('Đang kết nối...', nutDangGoi());
  await taoKetNoi(); await moKenhGoi();
  // báo "sẵn sàng" vài lần cho chắc (người gọi có thể vào kênh chậm hơn)
  let n=0; GOI.sanSang=setInterval(()=>{ if(!GOI || GOI.daNhanOffer || ++n>15){ if(GOI) clearInterval(GOI.sanSang); return; } guiKenh('san_sang'); }, 1000);
  guiKenh('san_sang');
}
async function tuChoiGoi(nhanTin){
  if(!GOI) return;
  const id=GOI.id, ht=GOI.ht; donGoi();
  await rpc('ht_tra_loi_goi',{p_goi:id, p_nghe:false});
  if(nhanTin){ await rpc('ht_gui',{p_ht:ht, p_noi_dung:'Mình đang bận, sẽ gọi lại sau nhé.'}); if(htMo&&htMo.id===ht) taiTinMoi(); }
}
function hienHinhMinh(){
  const v=document.getElementById('goiGan');
  if(GOI.loai==='video' && GOI.local){ v.srcObject=GOI.local; v.style.display='block'; v.play().catch(()=>{}); } else v.style.display='none';
}
function batTatMic(){ const t=GOI&&GOI.local&&GOI.local.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('goiNut').innerHTML=nutDangGoi(); } }
function batTatCam(){ const t=GOI&&GOI.local&&GOI.local.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('goiNut').innerHTML=nutDangGoi(); } }
async function doiCam(){
  if(!GOI || GOI.loai!=='video') return;
  GOI.mat = GOI.mat==='environment' ? 'user' : 'environment';
  try{
    const moi=await navigator.mediaDevices.getUserMedia({video:{facingMode:GOI.mat}});
    const t=moi.getVideoTracks()[0], cu=GOI.local.getVideoTracks()[0];
    const s=GOI.pc && GOI.pc.getSenders().find(x=>x.track && x.track.kind==='video');
    if(s) await s.replaceTrack(t);
    if(cu){ GOI.local.removeTrack(cu); cu.stop(); }
    GOI.local.addTrack(t);
    document.getElementById('goiGan').style.transform = GOI.mat==='user' ? 'scaleX(-1)' : 'none';
  }catch(e){ toast('Không đổi được camera'); }
}
function donGoi(){
  dungChuong();
  if(!GOI) return;
  dongThongBaoGoi(GOI.id);
  clearTimeout(GOI.het); clearTimeout(GOI.matSong); clearInterval(GOI.dongHo); clearInterval(GOI.sanSang);
  if(GOI.pc){ try{ GOI.pc.close(); }catch(e){} }
  if(GOI.local) GOI.local.getTracks().forEach(t=>t.stop());
  if(GOI.ch){ try{ sc.removeChannel(GOI.ch); }catch(e){} }
  GOI=null;
  const el=document.getElementById('goi'); el.style.display='none'; el.classList.remove('co-hinh','do-chuong');
  document.getElementById('goiXa').srcObject=null; document.getElementById('goiGan').srcObject=null;
  if(/goi=\d+/.test(location.hash)) history.replaceState(null,'',htMo?'#ht='+htMo.id:location.pathname);
}
async function ketThucGoi(chuDong, loiNhan){

  if(loiNhan) toast(loiNhan);
  await rpc('ht_ket_thuc_goi',{p_goi:id});

async function nhanRieng(id){
  dongHop();
  const r=await rpc('ht_mo_rieng',{p_emp:id});
  if(r.error){ toast('❌ '+r.error.message); return; }
  await taiDanhSach();
  if(!dsHt.find(x=>x.id===r.data)){ // hội thoại mới chưa có tin → chưa nằm trong danh sách
    const n=(dbCache||[]).find(x=>x.id===id)||{};
    dsHt.unshift({id:r.data, loai:'rieng', ten:n.ten, doi_phuong:id, doi_phuong_chuc_vu:n.chuc_vu, online_luc:n.online_luc, chua_doc:0});
  }
  await moHt(r.data);
}
async function moTaoNhom(){
  cheDoDb='nhom'; chonNguoi={}; htThemTv=null;
  moHop('Tạo nhóm', '<input class="oin" id="tenNhom" placeholder="Đặt tên nhóm" maxlength="100"><div id="dbChon"></div><input class="oin" id="dbTim" placeholder="Tìm người để thêm..." oninput="veDanhBa()"><div id="dbDs"><div class="trong">Đang tải...</div></div>',
    '<button class="nut" onclick="dongHop()">Huỷ</button><button class="nut c" id="dbOk" disabled onclick="taoNhom()">Tạo nhóm</button>');
  await taiDanhBa(); veDanhBa(); document.getElementById('tenNhom').focus();
}
async function taoNhom(){
  const ten=document.getElementById('tenNhom').value.trim();
  if(!ten){ toast('Hãy đặt tên nhóm'); document.getElementById('tenNhom').focus(); return; }
  const ids=Object.keys(chonNguoi).map(Number);
  const r=await rpc('ht_tao_nhom',{p_ten:ten, p_thanh_vien:ids});
  if(r.error){ toast('❌ '+r.error.message); return; }
  dongHop(); await taiDanhSach(); moHt(r.data);
}

/* ---------- thông tin hội thoại: thành viên, đổi tên, tắt thông báo, rời / xoá ---------- */
function moThongTin(){
  if(!htMo || !ttMo) return;
  const nhom=htMo.loai==='nhom', tvs=ttMo.thanh_vien||[];
  const laTruong=!!tvs.find(t=>t.id===toi.id && t.vai_tro==='truong');
  let h='';
  if(nhom){
    h+='<div class="dsmuc">Tên nhóm</div><div style="display:flex;gap:6px"><input class="oin" id="ttTen" value="'+esc(ttMo.ten||'')+'" maxlength="100"><button class="nut" style="margin-bottom:8px" onclick="doiTenNhom()">Lưu</button></div>';
  }
  h+='<label class="ng"><div class="gx"><div class="t1">Tắt thông báo</div><div class="t2">Không nhận thông báo đẩy của hội thoại này</div></div><input type="checkbox" '+(htMo.tat_tb?'checked':'')+' onchange="tatTb(this.checked)"></label>';
  if(nhom){
    h+='<div class="dsmuc">Thành viên ('+tvs.length+')</div><button class="nut c" style="width:100%;margin-bottom:6px" onclick="moThemTv()">+ Thêm thành viên</button>';
    h+=tvs.map(t=>'<div class="ng">'+avatar(t.id,t.ten,'',laOnline(t.online_luc))+'<div class="gx"><div class="t1">'+esc(t.ten)+(t.id===toi.id?' (Bạn)':'')+'</div><div class="t2">'+(t.vai_tro==='truong'?'🔑 Trưởng nhóm · ':'')+esc(t.chuc_vu||'')+'</div></div>'
      +(laTruong && t.id!==toi.id?'<button class="nut d" style="padding:5px 10px;font-size:12px" onclick="moiRa('+t.id+')">Mời ra</button>':'')
      +(t.id!==toi.id?'<button class="nut" style="padding:5px 10px;font-size:12px" onclick="nhanRieng('+t.id+')">Nhắn</button>':'')+'</div>').join('');
  }
  moHop(nhom?'Thông tin nhóm':'Thông tin hội thoại', h,
    (nhom?'<button class="nut d" onclick="roiNhom()">Rời nhóm</button>':'')+'<button class="nut d" onclick="xoaHt()">Xoá hội thoại</button>');
}
async function doiTenNhom(){
  const ten=document.getElementById('ttTen').value.trim(); if(!ten) return;
  const r=await rpc('ht_doi_ten_nhom',{p_ht:htMo.id, p_ten:ten});
  if(r.error){ toast('❌ '+r.error.message); return; }
  toast('✓ Đã đổi tên nhóm'); dongHop(); taiThongTin(); taiDanhSach();
}
async function tatTb(tat){
  const r=await rpc('ht_tat_tb',{p_ht:htMo.id, p_tat:tat});
  if(r.error){ toast('❌ '+r.error.message); return; }
  htMo.tat_tb=tat; toast(tat?'Đã tắt thông báo':'Đã bật thông báo'); taiDanhSach();
}
async function moThemTv(){
  cheDoDb='nhom'; chonNguoi={}; htThemTv=htMo.id;
  moHop('Thêm thành viên', '<div id="dbChon"></div><input class="oin" id="dbTim" placeholder="Tìm người..." oninput="veDanhBa()"><div id="dbDs"><div class="trong">Đang tải...</div></div>',
    '<button class="nut" onclick="dongHop()">Huỷ</button><button class="nut c" id="dbOk" disabled onclick="themTv()">Thêm</button>');
  await taiDanhBa(); veDanhBa();
}
async function themTv(){
  const r=await rpc('ht_them_tv',{p_ht:htThemTv, p_thanh_vien:Object.keys(chonNguoi).map(Number)});
  if(r.error){ toast('❌ '+r.error.message); return; }
  dongHop(); toast('✓ Đã thêm'); taiThongTin();
}
async function moiRa(id){
  const t=(ttMo.thanh_vien||[]).find(x=>x.id===id);
  if(!confirm('Mời '+(t?t.ten:'')+' ra khỏi nhóm?')) return;
  const r=await rpc('ht_xoa_tv',{p_ht:htMo.id, p_emp:id});
  if(r.error){ toast('❌ '+r.error.message); return; }
  dongHop(); taiThongTin();
}
async function roiNhom(){
  if(!confirm('Rời khỏi nhóm này? Bạn sẽ không xem được tin nhắn của nhóm nữa.')) return;
  const r=await rpc('ht_xoa_tv',{p_ht:htMo.id, p_emp:toi.id});
  if(r.error){ toast('❌ '+r.error.message); return; }
  dongHop(); dongChat(); taiDanhSach();
}
async function xoaHt(){
  if(!confirm('Xoá hội thoại khỏi danh sách của bạn? (Người khác vẫn giữ tin nhắn. Có tin mới hội thoại sẽ hiện lại.)')) return;
  const r=await rpc('ht_an_hoi_thoai',{p_ht:htMo.id});
  if(r.error){ toast('❌ '+r.error.message); return; }
  dongHop(); dongChat(); taiDanhSach();
}

/* ---------- tìm tin trong hội thoại ---------- */
function moTimTin(){
  moHop('Tìm tin nhắn', '<input class="oin" id="ttTim" placeholder="Nhập từ cần tìm (ít nhất 2 ký tự)..." oninput="timTin()"><div id="ttKq"></div>', '');
  document.getElementById('ttTim').focus();
}
let treTim=null;
function timTin(){
  clearTimeout(treTim);
  treTim=setTimeout(async ()=>{
    const q=document.getElementById('ttTim').value.trim(), el=document.getElementById('ttKq');
    if(q.length<2){ el.innerHTML=''; return; }
    const r=await rpc('ht_tim',{p_ht:htMo.id, p_tu:q});
    const ds=r.error?[]:(r.data||[]);
    el.innerHTML=ds.length?ds.map(m=>'<div class="ng" onclick="dongHop();denTin('+m.id+')"><div class="gx"><div class="t1">'+esc(m.ten_gui||'')+' <span style="font-weight:400;color:var(--mo);font-size:12px">'+gioNgan(m.tao_luc)+'</span></div><div class="t2">'+esc(m.noi_dung)+'</div></div></div>').join(''):'<div class="trong">Không tìm thấy.</div>';
  }, 300);
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ dongMenu(); dongHop(); } });
batDau();
</script>
