<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang tải ứng dụng…</title>
</head>
<body>
  <p>Đang tải ứng dụng…</p>
  <script>
    (async function () {
      var source = 'https://raw.githubusercontent.com/truongvanban0205-hash/Nhan-su-BCH/bfc75492930c3cf3e51dd24cbfbd50041dd77a72/index.html';
      try {
        var response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('Không tải được ứng dụng (' + response.status + ').');
        var html = await response.text();
        var app = new DOMParser().parseFromString(html, 'text/html');

        // Ẩn hai thông báo theo yêu cầu, không thay đổi trạng thái khóa theo thời gian.
        var style = app.createElement('style');
        style.textContent = '.rotate-banner,#lock-banner,#mmtb-lock-banner{display:none!important}';
        app.head.appendChild(style);

        // Chỉ báo khóa khi chạm vào ô nhập liệu; không chặn kéo bảng hoặc zoom cảm ứng.
        var lockHandler = app.createElement('script');
        lockHandler.textContent = "(function(){function lockedEditableCell(target){var cell=target&&target.closest&&target.closest('#mt td,#mmtb-mt td');if(!cell||!cell.querySelector('input,select,textarea'))return null;var screen=cell.closest('#screen-ns,#screen-mmtb');if(!screen)return null;var banner=document.getElementById(screen.id==='screen-ns'?'lock-banner':'mmtb-lock-banner');return banner&&banner.style.display==='flex'?cell:null;}document.addEventListener('click',function(e){if(!lockedEditableCell(e.target))return;e.preventDefault();e.stopImmediatePropagation();alert('Báo cáo đã khóa, không thể chỉnh sửa.');},true);})();";
        app.body.appendChild(lockHandler);

        document.open();
        document.write('<!DOCTYPE html>\n' + app.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p style="font:16px sans-serif;color:#b00020;padding:20px">Không thể tải ứng dụng. Vui lòng tải lại trang. Chi tiết: ' + String(error.message || error) + '</p>';
      }
    })();
  </script>
</body>
</html>
